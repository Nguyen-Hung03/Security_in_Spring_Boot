spring:
  application:
    name: auth
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  thymeleaf:
    cache: false
  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  docker:
    compose:
      enabled: true

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: false
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  tomcat:
    accesslog:
      enabled: false

app:
  base-url: http://localhost:8080
  production: false
  crypto:
    key: ${APP_ENCRYPTION_KEY:00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff}
  remember-me-key: ${APP_REMEMBER_ME_KEY:dev-only-remember-me-key-change}
  admin:
    email: ${APP_ADMIN_EMAIL:admin@fptaptech.edu.vn}
    password: ${APP_ADMIN_PASSWORD:Portal#Secure2026!}
    full-name: Quản trị viên

logging:
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: off
    org.springframework.security.authentication: warn
