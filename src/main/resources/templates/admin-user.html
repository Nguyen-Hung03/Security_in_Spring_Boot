<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Chi tiết tài khoản')}"></head>
<body class="bg-light">
<header th:replace="~{fragments :: nav}"></header>
<main class="container pb-5">
    <h1 class="h3" th:text="${user.email}">email</h1>
    <p th:text="${user.fullName}">Tên</p>
    <p>Vai trò: <span th:text="${user.role}">ROLE</span></p>
    <p>Trạng thái: <span th:text="${user.status}">ACTIVE</span></p>
    <p>Xác thực hai bước: <span th:text="${user.totpEnabled} ? 'Đang bật' : 'Chưa bật'">Chưa bật</span></p>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div class="d-flex flex-wrap gap-2 mb-4">
        <form th:if="${user.status == 'ACTIVE' or user.status == 'LOCKED'}" th:action="@{/admin/users/{id}/disable(id=${user.id})}" method="post">
            <button class="btn btn-warning" type="submit">Vô hiệu hóa</button>
        </form>
        <form th:if="${user.status == 'DISABLED' or user.status == 'LOCKED'}" th:action="@{/admin/users/{id}/enable(id=${user.id})}" method="post">
            <button class="btn btn-success" type="submit">Mở khóa</button>
        </form>
        <form th:action="@{/admin/users/{id}/logout(id=${user.id})}" method="post">
            <button class="btn btn-outline-secondary" type="submit">Buộc đăng xuất</button>
        </form>
        <form th:action="@{/admin/users/{id}/totp-reset(id=${user.id})}" method="post">
            <button class="btn btn-outline-secondary" type="submit">Tắt xác thực hai bước</button>
        </form>
    </div>
    <form th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post" class="card card-body mb-4">
        <label for="role" class="form-label">Gán vai trò</label>
        <div class="d-flex gap-2">
            <select id="role" name="role" class="form-select">
                <option value="ROLE_STUDENT" th:selected="${user.role == 'ROLE_STUDENT'}">Học viên</option>
                <option value="ROLE_LECTURER" th:selected="${user.role == 'ROLE_LECTURER'}">Giảng viên</option>
                <option value="ROLE_ADMIN" th:selected="${user.role == 'ROLE_ADMIN'}">Quản trị</option>
            </select>
            <button class="btn btn-primary" type="submit">Lưu</button>
        </div>
    </form>
    <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" class="card card-body border-danger">
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="confirm" value="true" id="confirm">
            <label class="form-check-label" for="confirm">Tôi hiểu tài khoản này sẽ bị xóa</label>
        </div>
        <button class="btn btn-danger" type="submit">Xóa tài khoản</button>
    </form>
</main>
</body>
</html>
