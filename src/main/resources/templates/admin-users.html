<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Quản trị tài khoản')}"></head>
<body class="bg-light">
<header th:replace="~{fragments :: nav}"></header>
<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Tài khoản</h1>
        <a class="btn btn-primary" th:href="@{/admin/users/invite}">Mời giảng viên / quản trị</a>
    </div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <form method="get" th:action="@{/admin/users}" class="row g-2 mb-3">
        <div class="col-md-4">
            <input class="form-control" name="email" th:value="${email}" placeholder="Tìm theo email">
        </div>
        <div class="col-md-3">
            <select class="form-select" name="role">
                <option value="">Mọi vai trò</option>
                <option value="ROLE_STUDENT" th:selected="${role == 'ROLE_STUDENT'}">Học viên</option>
                <option value="ROLE_LECTURER" th:selected="${role == 'ROLE_LECTURER'}">Giảng viên</option>
                <option value="ROLE_ADMIN" th:selected="${role == 'ROLE_ADMIN'}">Quản trị</option>
            </select>
        </div>
        <div class="col-md-3">
            <select class="form-select" name="status">
                <option value="">Mọi trạng thái</option>
                <option th:each="item : ${statuses}" th:value="${item}" th:text="${item}" th:selected="${status == item.name()}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <button class="btn btn-outline-primary w-100" type="submit">Lọc</button>
        </div>
    </form>
    <div class="table-responsive">
        <table class="table bg-white">
            <thead>
            <tr><th>Email</th><th>Họ tên</th><th>Vai trò</th><th>Trạng thái</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users.content}">
                <td th:text="${user.email}">a@b.c</td>
                <td th:text="${user.fullName}">Tên</td>
                <td th:text="${user.role}">ROLE_STUDENT</td>
                <td th:text="${user.status}">ACTIVE</td>
                <td><a th:href="@{/admin/users/{id}(id=${user.id})}">Chi tiết</a></td>
            </tr>
            </tbody>
        </table>
    </div>
    <nav class="d-flex gap-3" th:if="${users.totalPages > 1}">
        <a th:if="${users.hasPrevious()}"
           th:href="@{/admin/users(page=${users.number - 1},email=${email},role=${role},status=${status})}">Trước</a>
        <a th:if="${users.hasNext()}"
           th:href="@{/admin/users(page=${users.number + 1},email=${email},role=${role},status=${status})}">Sau</a>
    </nav>
</main>
</body>
</html>
