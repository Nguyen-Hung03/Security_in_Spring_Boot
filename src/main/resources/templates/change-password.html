<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đổi mật khẩu')}"></head>
<body class="bg-light">
<header th:replace="~{fragments :: nav}"></header>
<main class="container pb-5">
    <div class="col-lg-6">
        <h1 class="h3 mb-3">Đổi mật khẩu</h1>
        <div th:if="${param.changed}" class="alert alert-success">Đã đổi mật khẩu. Các phiên khác đã được đăng xuất.</div>
        <form th:action="@{/account/password}" th:object="${form}" method="post" class="card card-body" novalidate>
            <div class="mb-3">
                <label for="currentPassword" class="form-label">Mật khẩu hiện tại</label>
                <input th:field="*{currentPassword}" type="password" class="form-control" autocomplete="current-password"
                       th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{currentPassword}"></div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu mới</label>
                <input th:field="*{password}" type="password" class="form-control" autocomplete="new-password"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{password}"></div>
            </div>
            <div class="mb-3">
                <label for="passwordConfirm" class="form-label">Nhập lại mật khẩu mới</label>
                <input th:field="*{passwordConfirm}" type="password" class="form-control" autocomplete="new-password"
                       th:classappend="${#fields.hasErrors('passwordConfirm')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{passwordConfirm}"></div>
            </div>
            <button class="btn btn-primary" type="submit">Đổi mật khẩu</button>
        </form>
    </div>
</main>
</body>
</html>
