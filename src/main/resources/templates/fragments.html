<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Auth</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<header th:fragment="nav" class="bg-dark mb-4">
    <div class="container py-3 d-flex flex-wrap align-items-center gap-3">
        <a class="link-light fw-semibold text-decoration-none" th:href="@{/}">FPT Aptech</a>
        <a class="link-light" th:href="@{/account/profile}">Hồ sơ</a>
        <a class="link-light" th:href="@{/account/password}">Mật khẩu</a>
        <a class="link-light" th:href="@{/account/sessions}">Thiết bị</a>
        <a class="link-light" th:href="@{/account/2fa/setup}">Bảo mật</a>
        <a class="link-light" sec:authorize="hasAnyRole('LECTURER','ADMIN')" th:href="@{/lecturer/students}">Học viên</a>
        <a class="link-light" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}">Quản trị</a>
        <a class="link-light" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/audit}">Nhật ký</a>
        <form th:action="@{/logout}" method="post" class="ms-lg-auto">
            <button class="btn btn-outline-light btn-sm" type="submit">Đăng xuất</button>
        </form>
    </div>
</header>
</body>
</html>
