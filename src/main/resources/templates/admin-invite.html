<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Mời tài khoản')}"></head>
<body class="bg-light">
<header th:replace="~{fragments :: nav}"></header>
<main class="container pb-5">
    <div class="col-lg-6">
        <h1 class="h3 mb-3">Mời giảng viên hoặc quản trị viên</h1>
        <form th:action="@{/admin/users/invite}" th:object="${form}" method="post" class="card card-body" novalidate>
            <div class="mb-3">
                <label for="fullName" class="form-label">Họ tên</label>
                <input th:field="*{fullName}" class="form-control" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{fullName}"></div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input th:field="*{email}" type="email" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>
            <div class="mb-3">
                <label for="role" class="form-label">Vai trò</label>
                <select th:field="*{role}" class="form-select" th:classappend="${#fields.hasErrors('role')} ? 'is-invalid'">
                    <option value="ROLE_LECTURER">Giảng viên</option>
                    <option value="ROLE_ADMIN">Quản trị</option>
                </select>
                <div class="invalid-feedback" th:errors="*{role}"></div>
            </div>
            <button class="btn btn-primary" type="submit">Gửi lời mời</button>
        </form>
    </div>
</main>
</body>
</html>
