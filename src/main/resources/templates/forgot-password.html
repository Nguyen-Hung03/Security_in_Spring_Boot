<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Quên mật khẩu')}"></head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h1 class="h3 mb-4 text-center">Quên mật khẩu</h1>
            <form th:action="@{/forgot-password}" th:object="${form}" method="post" class="card card-body" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input th:field="*{email}" type="email" class="form-control" autocomplete="email"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Gửi hướng dẫn</button>
            </form>
            <p class="text-center mt-3"><a th:href="@{/login}">Quay lại đăng nhập</a></p>
        </div>
    </div>
</main>
</body>
</html>
