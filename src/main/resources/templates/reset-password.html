<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Đặt mật khẩu')}"></head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h1 class="h3 mb-4 text-center">Đặt mật khẩu</h1>
            <form th:action="@{/reset-password}" th:object="${form}" method="post" class="card card-body" novalidate>
                <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div>
                <input type="hidden" th:field="*{token}">
                <div class="mb-3">
                    <label for="password" class="form-label">Mật khẩu mới</label>
                    <input th:field="*{password}" type="password" class="form-control" autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>
                <div class="mb-3">
                    <label for="passwordConfirm" class="form-label">Nhập lại mật khẩu</label>
                    <input th:field="*{passwordConfirm}" type="password" class="form-control" autocomplete="new-password"
                           th:classappend="${#fields.hasErrors('passwordConfirm')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{passwordConfirm}"></div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Lưu mật khẩu</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
